<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Ella's Empire</title>
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    body { display: flex; height: 100vh; background: #050505; margin: 0; }
    .login-image { flex: 1; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=1000&q=80') center/cover; display: flex; flex-direction: column; justify-content: center; padding: 60px; color: #fff; }
    .login-image h1 { font-family: 'Cormorant Garamond', serif; font-size: 4rem; color: #C5A059; line-height: 1.1; margin: 0 0 20px 0; }
    .login-image p { font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; color: #ddd; margin: 0; }
    .login-form-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #0a0a0a; }
    .login-box { width: 100%; max-width: 400px; padding: 40px; }
    .login-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; color: #fff; margin: 0 0 10px 0; }
    .login-box p { color: #888; font-size: 0.9rem; margin: 0 0 40px 0; }
    @media (max-width: 768px) { body { flex-direction: column; } .login-image { display: none; } .login-form-container { height: 100vh; } }
  </style>
</head>
<body class="admin-body">

  <div class="login-image">
    <h1>ELLA'S<br>EMPIRE.</h1>
    <p>Staff & Admin Portal</p>
  </div>

  <div class="login-form-container">
    <div class="login-box">
      <h2>Welcome Back.</h2>
      <p>Please enter your admin credentials to access the dashboard.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label style="color:#C5A059;">Admin Password</label>
          <input type="password" id="password" placeholder="••••••••" required style="background:#111; border-color:#333; color:#fff; width: 100%; padding: 15px; border-radius: 8px; box-sizing: border-box; font-size: 1rem;">
        </div>
        <button type="submit" class="btn-admin" style="width: 100%;">Enter Workspace</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      if(pass === "ella2026") {
        window.location.href = "chat.html"; // Goes straight to Live Support
      } else {
        alert("Incorrect password! (Hint: ella2026)");
      }
    });
  </script>
</body>
</html>
